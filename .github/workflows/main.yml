name: Build S10 5G Kernel Images (boot, dtbo, dtb)

on:
  workflow_dispatch:
  push:
    branches: [ lineage-23.2 ]

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_samsung_exynos9820
          ref: lineage-23.2
          path: kernel
          
      - name: Install Build Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            git python3 make curl wget ccache clang lld \
            android-sdk-libsparse-utils python3-pip python3-setuptools

          # Fetch mkbootimg tools directly without git clone
          sudo wget https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-20.0/mkbootimg.py -O /usr/local/bin/mkbootimg
          sudo wget https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-20.0/unpack_bootimg.py -O /usr/local/bin/unpack_bootimg
          sudo chmod +x /usr/local/bin/mkbootimg /usr/local/bin/unpack_bootimg

          # Fetch standalone mkdtboimg tool
          sudo wget https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-20.0/utils/src/mkdtboimg.py -O /usr/local/bin/mkdtboimg
          sudo chmod +x /usr/local/bin/mkdtboimg
          
      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487594.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchain/clang
          rm clang.tar.gz

      - name: Download GCC Toolchains
        run: |
          mkdir -p toolchain/gcc64 toolchain/gcc32
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/gcc32

      - name: Compile S10 5G Kernel & Device Trees
        run: |
          cd kernel
          
          export PATH="$(pwd)/../toolchain/clang/bin:$(pwd)/../toolchain/gcc64/bin:$(pwd)/../toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export TARGET_SOC=exynos9820

          make exynos9820-beyondx_defconfig
          make -j$(nproc --all)

      - name: Process & Generate Target Images (S10 5G / beyondx)
        run: |
          mkdir -p output_images
          
          # Locate Kernel Binary
          if [ -f "kernel/arch/arm64/boot/Image.lz4" ]; then
            CP_IMAGE="kernel/arch/arm64/boot/Image.lz4"
          else
            CP_IMAGE="kernel/arch/arm64/boot/Image"
          fi
          
          # Extract S10 5G DTB
          DTB_PATH=$(find kernel/arch/arm64/boot/ -name "*beyondx*.dtb" -o -name "*exynos9820*.dtb" | head -n 1)
          if [ -n "$DTB_PATH" ]; then
            cp "$DTB_PATH" output_images/dtb.img
          else
            cat $(find kernel/arch/arm64/boot/ -name "*.dtb") > output_images/dtb.img
          fi

          # Create dtbo.img using mkdtboimg
          DTBO_FILES=$(find kernel/arch/arm64/boot/ -name "*.dtbo" | tr '\n' ' ')
          if [ -n "$DTBO_FILES" ]; then
            mkdtboimg create output_images/dtbo.img $DTBO_FILES
          else
            echo "No DTBO files found."
          fi

          # Pack final boot.img
          mkbootimg \
            --kernel "$CP_IMAGE" \
            --ramdisk /dev/null \
            --dtb output_images/dtb.img \
            --cmdline "console=ttySAC1,115200n8 androidboot.console=ttySAC1 androidboot.hardware=exynos9820" \
            --base 0x10000000 \
            --pagesize 2048 \
            --os_version 16.0.0 \
            --os_patch_level 2026-08 \
            --header_version 2 \
            --output output_images/boot.img

      - name: Upload Kernel Images
        uses: actions/upload-artifact@v4
        with:
          name: S10-5G-LineageOS-23.2-Images
          path: output_images/*
          
